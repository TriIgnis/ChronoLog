[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronolog"
version = "0.1.0"
description = "Ubuntu 科研与学习 Markdown 时间线日志软件"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ChronoLog Developers" }]
keywords = ["markdown", "journal", "timeline", "diary", "pyside6", "qt"]
dependencies = [
    "PySide6>=6.5",
    "markdown-it-py>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
chronolog = "chronolog.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chronolog = ["resources/icons/*.svg", "resources/styles/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
